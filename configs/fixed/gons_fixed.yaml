# GENERATED record (do not hand-edit). Regenerate with: python export_configs.py
# Source: gons_configs.py -> make_gons_cfg.
#
# ONE fixed configuration, shared by every dataset. `map_gamma` is the uniform
# knn20 bandwidth RULE, evaluated on each dataset's own base-session
# training split, so the only things that vary across datasets are the data paths
# and the base-class ratio.
#
# Reference value for verifying a re-implementation of the rule:
#   N-BaIoT seed 42 -> map_gamma = 0.0173399338 -> OS-HM 0.6565
task: fscil
experiment_name: fixed_<dataset>_s42
method: gons
dataset_config_path: configs/data/dataset.yaml
train_path: <DATASETS[dataset]['train']>
calibration_path: <DATASETS[dataset]['cal']>
test_path: <DATASETS[dataset]['test']>
output_root: artifacts/runs
base_class_ratio: <DATASETS[dataset]['ratio']>
base_class_seed: 42
novel_class_order: sorted
novel_support_fraction: 1.0
novel_support_max_k: 5
refresh_after_session: true
model:
  label_column: label
  seed: 42
  map_kind: rff
  map_kernel: rbf
  map_gamma: <resolved per (dataset, seed) by gons_configs.resolve_map_gamma -- knn20
    rule>
  map_n_components: 512
  d_proj_max: 32
  residual_handling: drop
  energy_temperature: 1.0
  enable_contrastive_rff: false
  score_support_penalty_alpha: 0.0
  score_support_penalty: false
  score_support_penalty_fn: log
  enable_ncdr_classification: true
  ncdr_threshold: 0.85
  threshold_quantile: 0.85
  scoring_mode: min_distance
  refresh_mode: single_pass
  enable_local_affine_screen: false
  support_trim_strategy: uniform
  preprocessing:
    numeric_scaler: quantile
