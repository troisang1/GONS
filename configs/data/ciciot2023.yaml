name: ciciot2023
version: v1
description: >
  CICIoT2023 dataset — 33 attacks in 7 categories + benign across 105 IoT
  devices.  Category-level labeling (8 classes) used for FSCIL evaluation.
raw_root: data/raw/ciciot2023
manifest_root: data/manifests/ciciot2023
default_subset: category_balanced
label_column: label
label_aliases:
  - Label
  - label
  - attack_type
drop_columns: []
numeric_overrides: []
categorical_overrides: []
subsets:
  - name: category_balanced
    description: >
      Balanced subset at category level (8 classes: benign + 7 attack categories).
    manifest: data/manifests/ciciot2023/category_balanced.yaml
    preferred_sources:
      - processed
layout:
  processed_dir: processed
  train_test_dir: train_test
  metadata_dir: metadata
  description_files: []
preprocessing:
  bound_categorical_cardinality: false
  ohe_min_frequency: 2
  ohe_max_categories: 1000000000
  d_input_max: 1000000000
